name: Keep visitor log awake

# Supabase pauses free projects after a week without activity. One read a few times a week keeps it up.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Count visitor marks
        env:
          URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -sf -D - -o /dev/null "$URL/rest/v1/visitor_marks?select=id" \
            -H "apikey: $KEY" -H "Prefer: count=exact" -H "Range: 0-0" | grep -i content-range
