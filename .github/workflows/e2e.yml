name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily check of the deployed site: catches dead project links and failed deploys
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  e2e:
    if: github.event_name != 'schedule'
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari, tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run suite against this commit (served locally)
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  visual:
    if: github.event_name != 'schedule'
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image the baselines were generated in (npm run test:visual:update)
    container: mcr.microsoft.com/playwright:v1.58.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=visual
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Smoke test (live site)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to publish this commit
        if: github.event_name == 'push'
        run: sleep 90
      - run: npx playwright test e2e/tests/smoke.spec.js e2e/tests/sections/projects.spec.js --project=chromium
        env:
          BASE_URL: https://eduardmilitarug.github.io/
